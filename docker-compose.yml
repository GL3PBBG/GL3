services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gl3
      POSTGRES_PASSWORD: gl3
      POSTGRES_DB: gl3
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gl3 -d gl3"]
      interval: 2s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
