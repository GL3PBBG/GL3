# The router for docker-compose.app.yml — the compose stand-in for the ingress
# the production deployment runs (see apps/web/serve.mjs: the web image serves
# only the SPA's own assets, and the browser speaks same-origin relative paths).
#
# /api and /assets go to the server image; /ws needs the upgrade headers or
# every WebSocket dies at the proxy; everything else is the SPA.
#
# The server container name (`server`) is the compose DNS name, stable because
# the compose file fixes the project name.

upstream gl3_server { server server:3000; }
upstream gl3_web { server web:8080; }

server {
  listen 80;

  # Idle game sockets live for hours; the default 60s read timeout would drop
  # a player mid-session the moment the feed goes quiet.
  proxy_read_timeout 1h;
  proxy_send_timeout 1h;

  location /api/ {
    client_max_body_size 2m;
    proxy_pass http://gl3_server;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /ws {
    proxy_pass http://gl3_server;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
  }

  # Uploaded game art is served by the server's own /assets/:key route
  # (ASSET_DRIVER=fs), not by the static SPA bundle.
  location /assets/ {
    proxy_pass http://gl3_server;
    proxy_set_header Host $host;
  }

  location / {
    proxy_pass http://gl3_web;
    proxy_set_header Host $host;
  }
}
